<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이 송 퀴 ver 2.0 (Premium Dark)</title>
    <style>
        /* [테마] 세련된 다크 테마 설정 */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #0a84ff;
            --accent-color: #ffd60a; /* 2배 이벤트용 골드 */
            --text-color: #ffffff;
            --text-dim: #b0b0b0;
        }

        body { font-family: -apple-system, sans-serif; text-align: center; background: var(--bg-color); color: var(--text-color); margin: 0; padding-bottom: 70px; }
        #main-container { display: flex; min-height: 100vh; }
        #game-area { flex: 3; padding: 20px; position: relative; overflow-x: hidden; }
        #user-sidebar { flex: 1; background: var(--surface-color); border-left: 1px solid #333; padding: 15px; min-width: 200px; text-align: left; }
        
        .screen { display: none; }
        .active { display: block; }
        
        /* [추가] 하단 내비게이션 탭 */
        #bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #1c1c1e; display: flex; border-top: 1px solid #333; z-index: 2000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); cursor: pointer; font-size: 0.8rem; }
        .nav-item.active { color: var(--primary-color); font-weight: bold; }
        
        /* 버튼 스타일 */
        button { border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        .btn-choice { width: 100%; padding: 18px; margin: 8px 0; background: #2c2c2e; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-size: 1.1rem; }
        .btn-choice.selected { background: var(--primary-color) !important; box-shadow: 0 0 15px var(--primary-color); }

        /* [복구] 2배 이벤트 배너 */
        #event-banner { 
            display: none; background: var(--accent-color); color: #000; padding: 12px; 
            font-weight: bold; border-radius: 12px; margin-bottom: 15px; 
            animation: blink 0.8s infinite; box-shadow: 0 0 20px rgba(255, 214, 10, 0.5);
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* 방장 컨트롤러 */
        #host-controller { position: fixed; bottom: 65px; left: 5%; width: 90%; background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px); color: white; padding: 15px; display: none; justify-content: center; gap: 8px; flex-wrap: wrap; z-index: 3000; border-radius: 20px; border: 1px solid #444; }
        #host-controller button { padding: 8px 15px; font-size: 0.75rem; background: #3a3a3c; color: white; }

        /* 경품 그리드 */
        .prize-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
        .prize-item { background: var(--surface-color); border-radius: 15px; overflow: hidden; border: 1px solid #333; }
        .prize-item img { width: 100%; display: block; }
        .sold-out-info { background: #321214; color: #ff453a; padding: 10px; font-size: 0.8rem; text-align: left; }
        
        /* 엔딩 크레딧 */
        #credits-box { position: absolute; width: 100%; bottom: -100%; animation: scrollUp 25s linear forwards; }
        @keyframes scrollUp { from { bottom: -100%; } to { bottom: 150%; } }
        .credit-text { margin: 60px 0; font-size: 1.8rem; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

        @media (min-width: 800px) { .prize-grid { grid-template-columns: repeat(4, 1fr); } }
    </style>
</head>
<body>

<div id="main-container">
    <div id="game-area">
        <div id="event-banner">🔥 지금 정답을 맞히면 점수가 2배! 🔥</div>

        <div id="tab-home" class="tab-content active">
            <div id="screen-scene1" class="screen active">
                <h1 style="font-size: 2.5rem; margin-top: 50px;">이 송 퀴</h1>
                <p style="color: var(--text-dim);">대기실에 입장하여 준비해주세요.</p>
                <input type="text" id="nickname-input" placeholder="닉네임 입력" style="background: #2c2c2e; color: white; border: none;">
                <button onclick="joinGame()" style="padding:15px 40px; background: var(--primary-color); color:white; margin-top:20px; font-size:1.1rem;">입장하기</button>
            </div>

            <div id="screen-scene2" class="screen">
                <h2 style="color: var(--primary-color);">📜 퀴즈 안내</h2>
                <div id="desc-container">
                    <p class="fade-in-text">✅ 총 3가지 타입의 퀴즈가 준비되었습니다.</p>
                    <p class="fade-in-text">🔥 중간중간 점수 2배 이벤트가 진행됩니다.</p>
                    <p class="fade-in-text">🏆 마지막 승자는 누가 될까요?</p>
                </div>
            </div>

            <div id="screen-quiz" class="screen">
                <h2 id="question-text" style="font-size: 1.5rem;"></h2>
                <div id="choices-area"></div>
                <button id="submit-btn" onclick="finalSubmit()" style="display:none; background:#32d74b; color:black; padding:18px; width:100%; margin-top:15px;">정답 제출</button>
            </div>

            <div id="screen-reveal" class="screen">
                <h2 style="color: #32d74b;">결과 공개</h2>
                <div id="random-correct-list" style="padding: 20px; background: var(--surface-color); border-radius: 15px;"></div>
            </div>

            <div id="screen-mid-rank" class="screen"><h2>📊 현재 순위</h2><div id="mid-rank-container"></div></div>
            
            <div id="screen-credits" class="screen">
                <div id="credits-box">
                    <div class="credit-text">🎬 Special Thanks</div>
                    <div class="credit-text">함께해주신 모든 동료분들</div>
                    <div class="credit-text">--- 롤링 페이퍼 ---</div>
                    <div class="credit-text">"모두 고생 많으셨습니다!"</div>
                    <div class="credit-text">Powered by LeeSongQuiz</div>
                </div>
            </div>
        </div>

        <div id="tab-prizes" class="tab-content" style="display:none;">
            <h2 style="color: var(--accent-color);">🎁 경품 목록</h2>
            <div class="prize-grid" id="prize-list"></div>
        </div>

        <div id="host-controller">
            <input type="password" id="host-pw" style="width:40px; background:#444; border:none; color:white;" placeholder="PW">
            <button onclick="sendStart('tutorial')" style="background:#32d74b; color:black;">연습</button>
            <button onclick="sendStart('main')" style="background:var(--primary-color);">본게임</button>
            <button onclick="socket.emit('request_reveal', getPW())">정답</button>
            <button onclick="socket.emit('request_mid_rank', getPW())">Top3</button>
            <button onclick="socket.emit('request_final_rank', getPW())" style="background:#6c5ce7">전원순위</button>
            <button onclick="socket.emit('toggle_multiplier', getPW())" style="background:var(--accent-color); color:black;">2배</button>
            <button onclick="socket.emit('request_scene', {pw:getPW(), scene:'credits'})">엔딩</button>
            <button onclick="socket.emit('request_reset', getPW())" style="background:#ff453a">리셋</button>
        </div>
    </div>

    <div id="user-sidebar">
        <h3 style="display:flex; justify-content:space-between; align-items:center;">
            👥 참여자
            <div style="display:flex; gap:5px;">
                <small onclick="toggleAdminMode()" id="admin-toggle-btn" style="color:var(--text-dim); cursor:pointer; font-size:0.7rem; border:1px solid #555; padding:2px 5px; border-radius:4px;">Admin Mode</small>
                <small onclick="toggleHostPanel()" style="color:var(--primary-color); cursor:pointer; font-size:0.7rem; background:#2c2c2e; padding:2px 5px; border-radius:4px;">Menu</small>
            </div>
        </h3>
        <div id="sidebar-user-list"></div>
    </div>
</div>

<div id="bottom-nav">
    <div class="nav-item active" onclick="switchTab('home')">🏠<br>퀴즈홈</div>
    <div class="nav-item" onclick="switchTab('prizes')">🎁<br>경품목록</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let amIShowingIDs = false;
    let prizeImages = [
        { img: "https://i.imgur.com/yXL0cU8.jpg", donor: "이태빈" },
        { img: "https://i.imgur.com/eSmoPX4.jpeg", donor: "양예람" },
        { img: "https://i.imgur.com/ZgfVo57.jpeg", donor: "김유정" },
        // ... 이미지 리스트 ...
    ];

    const getPW = () => document.getElementById('host-pw').value;
    const sendStart = (mode) => socket.emit('request_start', { pw: getPW(), mode: mode });

    // [추가] 탭 전환 시스템
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        
        document.getElementById('tab-' + tabId).style.display = 'block';
        event.currentTarget.classList.add('active');
    }

    // [추가] 사이드바 관리모드 토글
    function toggleAdminMode() {
        if (getPW() !== "1224") return alert("비밀번호를 먼저 하단 메뉴 PW칸에 입력해주세요!");
        amIShowingIDs = !amIShowingIDs;
        document.getElementById('admin-toggle-btn').style.borderColor = amIShowingIDs ? "var(--primary-color)" : "#555";
        renderUserList();
        socket.emit('request_prize_sync');
        alert(amIShowingIDs ? "관리 모드 활성화" : "관리 모드 비활성화");
    }

    function toggleHostPanel() {
        const panel = document.getElementById('host-controller');
        panel.style.display = (panel.style.display === 'flex') ? 'none' : 'flex';
    }

    // 2배 이벤트 수신
    socket.on('multiplier_update', (m) => {
        document.getElementById('event-banner').style.display = (m === 2) ? 'block' : 'none';
    });

    // 씬 전환 핸들러
    socket.on('change_scene', (scene) => {
        if(scene === 'prizes') { switchTab('prizes'); return; }
        switchTab('home');
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-' + scene).classList.add('active');
        if(scene === 'credits') {
            const box = document.getElementById('credits-box');
            box.style.animation = 'none'; box.offsetHeight; box.style.animation = null;
        }
    });

    // 경품 렌더링 (참여자와 방장 공용)
    function renderPrizes(winners = {}) {
        const grid = document.getElementById('prize-list');
        grid.innerHTML = prizeList.map((p, i) => {
            const id = i + 1;
            const winner = winners[id];
            return `
                <div class="prize-item">
                    <img src="${p.img}" style="${winner ? 'filter:grayscale(1) opacity(0.5)' : ''}">
                    ${winner ? `<div class="sold-out-info">🎁 주인: ${p.donor}<br>🏆 당첨: ${winner}</div>` : 
                    `<div style="padding:10px; display:${amIShowingIDs ? 'block' : 'none'}">
                        <input type="text" id="win-${id}" style="width:50px; font-size:0.7rem;">
                        <button onclick="saveWinner(${id})">저장</button>
                    </div>`}
                </div>`;
        }).join('');
    }

    function saveWinner(id) {
        const name = document.getElementById(`win-${id}`).value;
        socket.emit('claim_prize', { pw: getPW(), prizeId: id, winnerName: name });
    }

    socket.on('prize_updated', (winners) => renderPrizes(winners));
    // ... 나머지 기존 socket.io 핸들러 (update_user_list, next_question 등) 동일하게 유지 ...
</script>
</body>
</html>
