<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이 송 퀴 ver 1.1</title>
    <style>
        :root { --bg: #0f0f0f; --surf: #1a1a1a; --card: #242424; --primary: #007aff; --accent: #ffd60a; --text: #fff; --dim: #a0a0a0; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; }
        #main-container { display: flex; min-height: 100vh; }
        #game-area { flex: 3; padding: 20px; position: relative; }
        #user-sidebar { flex: 1; background: var(--surf); border-left: 1px solid #333; padding: 15px; min-width: 250px; }

        @media (max-width: 800px) {
            #main-container { flex-direction: column; }
            #user-sidebar { border-left: none; border-top: 1px solid #333; padding-bottom: 100px; }
            #sidebar-content { display: none; } /* 모바일 기본값: 최소화 */
        }

        .screen { display: none; animation: fadeIn 0.3s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: rgba(20,20,22,0.9); backdrop-filter: blur(10px); display: flex; border-top: 1px solid #333; z-index: 2000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--dim); cursor: pointer; font-size: 0.75rem; }
        .nav-item.active { color: var(--primary); font-weight: bold; }

        .btn-choice { width: 100%; padding: 18px; margin: 10px 0; background: var(--card); color: white; font-size: 1.1rem; border: 1px solid #333; border-radius: 12px; cursor: pointer; }
        .btn-choice.selected { background: var(--primary) !important; box-shadow: 0 0 15px var(--primary); }

        #event-banner { display: none; background: var(--accent); color: #000; padding: 12px; font-weight: bold; border-radius: 12px; margin-bottom: 15px; text-align: center; animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        #host-controller { position: fixed; bottom: 85px; left: 5%; width: 90%; background: #222; padding: 15px; display: none; justify-content: center; gap: 8px; flex-wrap: wrap; z-index: 3000; border-radius: 20px; border: 1px solid #444; }
        #host-controller button { padding: 8px 12px; font-size: 0.75rem; background: #3a3a3c; color: white; border: none; border-radius: 8px; cursor: pointer; }

        .prize-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 15px; }
        @media (max-width: 600px) { .prize-grid { grid-template-columns: repeat(2, 1fr); } }
        .prize-item { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #333; position: relative; }
        .prize-item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .sold-out-footer { background: #3d1416; color: #ff453a; padding: 10px; font-size: 0.8rem; text-align: left; }
        
        .fade-in-text { opacity: 0; transform: translateY(10px); transition: 0.8s; margin: 15px 0; }
        .fade-in-text.visible { opacity: 1; transform: translateY(0); }

        #credits-box { position: absolute; width: 100%; bottom: -100%; animation: scrollUp 30s linear forwards; }
        @keyframes scrollUp { from { bottom: -100%; } to { bottom: 150%; } }
        
        input { padding: 12px; border-radius: 8px; background: #2c2c2e; color: white; border: 1px solid #333; }

        #image-modal {
        display: none; /* 기본은 숨김 */
        position: fixed;
        z-index: 5000; /* 최상단에 위치 */
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: rgba(0, 0, 0, 0.9); /* 배경 어둡게 */
        backdrop-filter: blur(5px); /* 배경 흐림 효과 */
        justify-content: center;
        align-items: center;
        cursor: zoom-out;
    }

    #modal-img {
        max-width: 90%;
        max-height: 80%;
        border-radius: 15px;
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        transform: scale(0.9);
        transition: transform 0.3s ease;
    }

    #image-modal.active #modal-img {
        transform: scale(1);
    }

    .modal-close-hint {
        position: absolute;
        bottom: 30px;
        color: var(--text-dim);
        font-size: 0.9rem;
    }
    </style>
</head>
<body>

<div id="main-container">
    <div id="game-area">
        <div id="event-banner">🔥 정답자 점수 2배 이벤트 중! 🔥</div>

        <div id="tab-home" class="tab-content active">
            <div id="screen-scene1" class="screen active">
            <h1 style="font-size: 2.5rem; margin-top: 30px;">이 송 퀴</h1>
            <input type="text" id="nickname-input" placeholder="닉네임 입력">
            <button onclick="joinGame()" style="padding:15px 40px; background: var(--primary-color); color:white; margin-top:15px; width:80%;">퀴즈 참여하기</button>
    
             <p style="margin-top: 20px; color: var(--text-dim); font-size: 0.9rem;">
                퀴즈 참여 전이신가요? <br>
                <span onclick="switchTab('prizes')" style="color: var(--accent-color); text-decoration: underline; cursor: pointer;">애장품 목록 먼저 구경하기</span>
             </p>
        </div>
            <div id="screen-scene2" class="screen">
                <h2 style="color:var(--primary);">📜 퀴즈 안내</h2>
                <div id="desc-container"></div>
            </div>
            <div id="screen-quiz" class="screen">
                <div id="rem-count" style="color:var(--accent); font-weight:bold; margin-bottom:10px;"></div>
                <h2 id="question-text"></h2>
                <div id="choices-area"></div>
                <button id="submit-btn" onclick="finalSubmit()" style="display:none; background:#32d74b; color:black; padding:18px; width:100%; margin-top:15px; border-radius:12px;">정답 제출</button>
            </div>
            <div id="screen-reveal" class="screen">
                <h2 style="color:#32d74b;">결과 공개</h2>
                <div id="reveal-content" style="padding:20px; background:var(--surf); border-radius:20px;"></div>
            </div>
            <div id="screen-mid-rank" class="screen"><h2>📊 실시간 순위</h2><div id="rank-container"></div></div>
            <div id="screen-credits" class="screen"><div id="credits-box"><h2>🎬 Thanks To</h2><p>오늘 함께한 모두 고생하셨습니다!</p><p>Powered by LeeSongQuiz</p></div></div>
        </div>

        <div id="tab-prizes" class="tab-content" style="display:none;">
            <h2 style="color:var(--accent);">🎁 애장품 목록</h2>
            <div class="prize-grid" id="prize-list"></div>
        </div>

        <div id="host-controller">
            <input type="password" id="host-pw" style="width:40px;" placeholder="PW">
            <button onclick="sendStart('tutorial')" style="background:#32d74b; color:black;">연습</button>
            <button onclick="sendStart('main')" style="background:var(--primary);">본게임</button>
            <button onclick="socket.emit('request_reveal', getPW())">정답</button>
            <button onclick="socket.emit('request_mid_rank', getPW())">Top3</button>
            <button onclick="socket.emit('request_final_rank', getPW())">전원순위</button>
            <button onclick="socket.emit('toggle_multiplier', getPW())" style="background:var(--accent); color:black;">2배</button>
            <button onclick="socket.emit('request_scene', {pw:getPW(), scene:'credits'})">엔딩</button>
            <button onclick="socket.emit('request_reset', getPW())" style="background:#ff3b30">리셋</button>
        </div>
    </div>

    <div id="user-sidebar">
        <h3 style="display:flex; justify-content:space-between; align-items:center;">
            👥 참여자 <span id="toggle-sidebar-btn" onclick="toggleSidebar()" style="cursor:pointer; font-size:0.8rem; color:var(--primary);">▼</span>
            <div style="display:flex; gap:5px;">
                <small onclick="toggleAdmin()" id="admin-btn" style="color:var(--dim); cursor:pointer; font-size:0.7rem; border:1px solid #444; padding:2px 5px; border-radius:4px;">관리모드</small>
                <small onclick="toggleHost()" style="color:var(--primary); cursor:pointer; font-size:0.7rem; background:#222; padding:2px 5px; border-radius:4px;">메뉴</small>
            </div>
        </h3>
        <div id="sidebar-content">
            <div id="user-list"></div>
        </div>
    </div>
</div>

<div id="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="switchTab('home')">🏠<br>홈</div>
    <div class="nav-item" id="nav-prizes" onclick="switchTab('prizes')">🎁<br>애장품</div>
</div>

<div id="image-modal" onclick="closeImageModal()">
    <img id="modal-img" src="" alt="Enlarged Prize">
    <div class="modal-close-hint">화면을 클릭하면 닫힙니다</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let amIAdmin = false, lastPlayers = [];
    const prizeList = [
        { img: "https://i.imgur.com/yXL0cU8.jpg", donor: "이태빈" },
        { img: "https://i.imgur.com/AR3hcaS.png", donor: "이재문" },
        { img: "https://i.imgur.com/7BbylT8.png", donor: "양애리" },
        { img: "https://i.imgur.com/AnKzYed.jpeg", donor: "이광욱" },
        { img: "https://i.imgur.com/kFR55Wp.jpeg", donor: "김세온" },
        { img: "https://i.imgur.com/TSD72Zb.jpeg", donor: "유지희" },
        { img: "https://i.imgur.com/JD2LdyI.jpeg", donor: "이광욱" },
        { img: "https://i.imgur.com/CwbXlzM.jpeg", donor: "이광욱" },
        { img: "https://i.imgur.com/TsJ1Qhm.jpeg", donor: "김소희" },
        { img: "https://i.imgur.com/KSISTtA.jpeg", donor: "김은철" },
        { img: "https://i.imgur.com/j5jVENC.jpeg", donor: "윤지혁" },
        { img: "https://i.imgur.com/9QNDwSr.jpeg", donor: "김유정" },
        { img: "https://i.imgur.com/qpaJRSn.jpeg", donor: "강희수" }
    ];
    for(let i=prizeList.length; i<20; i++) prizeList.push({ img: "https://placehold.co/300x300/222/888?text=Prize", donor: "준비중" });

    window.onload = () => {
        // 1. 저장된 닉네임 불러오기
        const savedName = localStorage.getItem('quiz_nickname');
        if (savedName) document.getElementById('nickname-input').value = savedName;
        
        // 2. 접속 즉시 경품 데이터 동기화 요청 (참가 안 한 사람도 볼 수 있게)
        socket.emit('request_prize_sync');
    };
    
    const getPW = () => document.getElementById('host-pw').value;
    const sendStart = (mode) => socket.emit('request_start', { pw: getPW(), mode });

    function joinGame() {
        const nick = document.getElementById('nickname-input').value;
        if(!nick) return alert("닉네임을 입력해주세요!");
        
        let userID = localStorage.getItem('quiz_id');
        if(!userID) {
            userID = 'u_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('quiz_id', userID);
        }
        localStorage.setItem('quiz_nickname', nick);
        
        socket.emit('join_waiting_room', { userID, nickname: nick });
        alert("접속 성공!");
    }

    function switchTab(t) {
        document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-'+t).style.display = 'block';
        document.getElementById('nav-'+t).classList.add('active');
    }

    // 모바일 참여자 목록 토글 기능
    function toggleSidebar() {
        const content = document.getElementById('sidebar-content');
        const btn = document.getElementById('toggle-sidebar-btn');
        if(content.style.display === 'block') {
            content.style.display = 'none'; btn.innerText = '▼';
        } else {
            content.style.display = 'block'; btn.innerText = '▲';
        }
    }

    function toggleAdmin() {
        if(getPW() !== "1224") return alert("PW!");
        amIAdmin = !amIAdmin; renderUsers(); socket.emit('request_prize_sync');
    }
    function toggleHost() { const p = document.getElementById('host-controller'); p.style.display = (p.style.display==='flex'?'none':'flex'); }

    socket.on('change_scene', (s) => {
        if(s === 'prizes') return switchTab('prizes');
        switchTab('home');
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById('screen-'+s).classList.add('active');
        if(s === 'scene2') {
            const c = document.getElementById('desc-container');
            c.innerHTML = '<p class="fade-in-text">✅ 3가지 타입 퀴즈 시작</p><p class="fade-in-text">🔥 2배 이벤트 존재</p><p class="fade-in-text">🏆 최종 우승자는 누구?</p>';
            setTimeout(()=>document.querySelectorAll('.fade-in-text').forEach((el,i)=>setTimeout(()=>el.classList.add('visible'),i*800)), 100);
        }
    });

    socket.on('multiplier_update', m => document.getElementById('event-banner').style.display = (m===2?'block':'none'));
    socket.on('update_user_list', d => { lastPlayers = d.players; renderUsers(); });

    function renderUsers() {
        document.getElementById('user-list').innerHTML = lastPlayers.map(u => 
            `<div style="background:var(--card); padding:8px; border-radius:8px; margin-bottom:5px; font-size:0.9rem;">
                <span style="color:${u.online?'var(--primary)':'#555'}">●</span> ${u.nickname} ${amIAdmin?`<small style="color:var(--primary)">id:${u.userID}</small>`:''}
            </div>`).join('');
    }

    // [수정] 문제 수신 시 보기 영역 생성 로직
    socket.on('next_question', d => {
        switchTab('home');
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById('screen-quiz').classList.add('active');
        document.getElementById('question-text').innerText = d.q;
        
        const area = document.getElementById('choices-area');
        area.innerHTML = '';
        area.style.display = 'block'; 
        
        d.a.forEach((choice, i) => {
            const btn = document.createElement('button');
            btn.className = 'btn-choice';
            btn.innerText = choice;
            
            btn.onclick = () => {
                if (d.type === 'balance') {
                    // [핵심 수정] 밸런스 게임일 때는 다른 버튼의 'selected' 클래스를 모두 제거
                    document.querySelectorAll('.btn-choice').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                } else if (d.type === 'multi') {
                    // 다중 선택 퀴즈일 때만 기존처럼 토글 유지
                    btn.classList.toggle('selected');
                } else {
                    // 일반 단일 선택 퀴즈
                    socket.emit('submit_answer', [i]);
                    area.style.display = 'none';
                }
            };
            area.appendChild(btn);
        });
        
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.style.display = (d.type === 'multi' || d.type === 'balance' ? 'block' : 'none');
    });

    function toggleSidebar() {
        const content = document.getElementById('sidebar-content');
        const btn = document.getElementById('toggle-sidebar-btn');
        if(content.style.display === 'block') {
            content.style.display = 'none';
            btn.innerText = '▼';
        } else {
            content.style.display = 'block';
            btn.innerText = '▲';
        }
    }

    function finalSubmit() {
        const sel = Array.from(document.querySelectorAll('.btn-choice.selected')).map(b => Array.from(b.parentNode.children).indexOf(b));
        if(!sel.length) return alert("선택!");
        socket.emit('submit_answer', sel); document.getElementById('choices-area').style.display = 'none'; document.getElementById('submit-btn').style.display = 'none';
    }

    function openImageModal(src) {
        const modal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-img');
    
        modalImg.src = src;
        modal.style.display = 'flex';
    
    // 약간의 지연 후 애니메이션 효과
        setTimeout(() => {
            modal.classList.add('active');
        }, 10);
    }

    // [추가] 이미지 모달 닫기
    function closeImageModal() {
        const modal = document.getElementById('image-modal');
        modal.classList.remove('active');
        setTimeout(() => {
            modal.style.display = 'none';
        }, 300);
    }

    socket.on('prize_updated', winners => {
    const grid = document.getElementById('prize-list');
    grid.innerHTML = prizeList.map((p, i) => {
        const id = i+1, win = winners[id];
        return `<div class="prize-item">
            <div style="position:absolute; top:5px; left:5px; background:rgba(0,0,0,0.5); padding:2px 6px; border-radius:4px; font-size:0.7rem;">${id}번</div>
            
            <img src="${p.img}" 
                 onclick="openImageModal('${p.img}')" 
                 style="cursor:zoom-in; ${win?'filter:grayscale(1) brightness(0.3)':''}">
            
            ${win ? `<div class="sold-out-footer">🎁 주인: ${p.donor}<br>🏆 당첨: ${win}</div>` : 
            `<div style="padding:10px; display:${amIAdmin?'block':'none'}">
                <input type="text" id="win-${id}" placeholder="이름" style="width:60px; font-size:0.7rem; padding:3px;">
                <button onclick="socket.emit('claim_prize', {pw:getPW(), prizeId:${id}, winnerName:document.getElementById('win-${id}').value})" style="font-size:0.7rem; padding:3px 6px;">저장</button>
            </div>`}
        </div>`;
    }).join('');
});

   // [수정] 정답 및 결과 공개 수신 핸들러
    socket.on('reveal_answer', d => {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById('screen-reveal').classList.add('active');
        
        const c = document.getElementById('reveal-content');
        c.innerHTML = ""; // 기존 내용 초기화

        if (d.type === "balance") {
            // 밸런스 게임: 다수결에 속한 모든 사람의 이름을 세로로 나열
            let html = "";
            d.winners.forEach(idx => {
                const optionName = d.options[idx];
                const winnerList = d.votersByOption[idx]; // 서버에서 보내준 명단
                
                html += `
                    <div style="margin-bottom: 20px; border: 1px solid var(--primary); padding: 15px; border-radius: 12px; background: rgba(0, 122, 255, 0.1);">
                        <h3 style="color: var(--primary); margin-top: 0;">🏆 ${optionName} 선택자 (승리!)</h3>
                        <div style="line-height: 1.8; font-size: 1.1rem;">
                            ${winnerList.length > 0 ? winnerList.join('<br>') : "선택자가 없습니다."}
                        </div>
                    </div>
                `;
            });
            c.innerHTML = html;
        } else {
            // 일반 퀴즈: 정답자 명단을 세로로 나열
            const namesVertical = d.allCorrectNames.length > 0 ? d.allCorrectNames.join('<br>') : "정답자가 없습니다.";
            c.innerHTML = `
                <div style="border: 1px solid var(--success); padding: 15px; border-radius: 12px; background: rgba(52, 199, 89, 0.1);">
                    <h3 style="color: var(--success); margin-top: 0;">🎯 정답자 명단</h3>
                    <div style="line-height: 1.8; font-size: 1.1rem;">
                        ${namesVertical}
                    </div>
                </div>
            `;
        }
    });

    socket.on('show_mid_rank', f => {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById('screen-mid-rank').classList.add('active');
        document.getElementById('rank-container').innerHTML = f.map(r => `<div style="padding:10px; border-bottom:1px solid #333; display:flex; justify-content:space-between;"><span>${r.rank}위 ${r.type==='full'?r.name:'***'}</span><span>${r.score}점</span></div>`).join('');
    });
</script>
</body>
</html>
